[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "practicum-desktop"
version = "0.1.0"
description = "Windows desktop shell for Practicum."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7,<7.0",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[project.scripts]
practicum-desktop = "practicum_desktop.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/practicum_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
